name: Deploy Preview

on:
  pull_request:
    branches: [main]

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: https://deploy-preview-${{ github.event.pull_request.number }}--earnest-cocada-04456b.netlify.app
    steps:
      - name: Wait for Netlify
        run: |
          URL="https://deploy-preview-${{ github.event.pull_request.number }}--earnest-cocada-04456b.netlify.app"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Deploy preview is live at $URL"
              exit 0
            fi
            echo "Waiting for deploy preview... (attempt $i, status: $STATUS)"
            sleep 10
          done
          echo "Deploy preview did not become available within 5 minutes"
          exit 1
